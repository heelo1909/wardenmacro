[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "warden"
version = "0.1.0"
description = "Warden - unattended RIVALS public FFA session runner (personal tool)"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "mss>=9.0",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "psutil>=5.9",
    "pynput>=1.7",
    "pywin32>=306; sys_platform == 'win32'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
input-fallbacks = ["pydirectinput>=1.0.4; sys_platform == 'win32'"]
integrations = [
    "requests>=2.31",
    "discord.py>=2.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "winotify>=1.1; sys_platform == 'win32'",
]
dev = ["pytest>=8.0", "pyinstaller>=6.5"]

[project.scripts]
warden = "warden.__main__:main"

[tool.setuptools.packages.find]
include = ["warden*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
