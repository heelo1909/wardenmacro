# Builds Warden.app on GitHub's macOS runners, wraps it in a .dmg, and
# attaches it to the GitHub Release for the pushed tag. Nobody needs a Mac
# or Terminal to produce a Mac build.
#
#   Push a tag like v0.2.0 (or a test tag like v0.0.1-mactest) -> build + release.
#   Tags with a "-" in them (v0.0.1-mactest) become pre-releases.
#   "Run workflow" on the Actions tab -> build only (DMGs as downloadable artifacts).
#
# The Windows build is separate and unchanged. No secrets are used beyond the
# built-in GITHUB_TOKEN, and nothing is notarized (that needs a paid Apple
# Developer account), so users see a one-time "can't verify" warning.

name: Mac release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # Intel is best-effort: GitHub's last Intel image (macos-15-intel) is
    # scheduled to retire in 2027, and an Intel failure shouldn't block the
    # Apple Silicon release.
    continue-on-error: ${{ matrix.arch == 'x86_64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple Silicon
            arch: arm64
          - runner: macos-15-intel  # Intel
            arch: x86_64
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import platform, sys; print(sys.version, platform.machine())"

      - name: Mac port tests (must pass)
        run: python -m pytest tests/test_mac_port.py tests/test_mac_platform.py -q -p no:cacheprovider

      - name: Full test suite (report only)
        # Some older tests assume Windows names/APIs; they're tracked in
        # PROGRESS.md and don't block a Mac build. Results are uploaded below.
        continue-on-error: true
        timeout-minutes: 20
        run: python -m pytest -q -p no:cacheprovider --junit-xml=pytest-full-${{ matrix.arch }}.xml

      - name: Selftest from source
        run: python -m warden --selftest

      - name: Build Warden.app
        run: python -m PyInstaller warden.spec --clean --noconfirm

      - name: Check the app's architecture
        run: |
          file dist/Warden.app/Contents/MacOS/Warden
          lipo -archs dist/Warden.app/Contents/MacOS/Warden | grep -w "${{ matrix.arch }}"

      - name: Selftest the built app
        run: dist/Warden.app/Contents/MacOS/Warden --selftest

      - name: Build DMG
        run: bash scripts/mac/build_dmg.sh "${{ matrix.arch }}"

      - name: Selftest the app inside the DMG
        run: |
          MNT="$(mktemp -d)"
          hdiutil attach "dist/Warden-mac-${{ matrix.arch }}.dmg" -nobrowse -readonly -mountpoint "$MNT"
          test -L "$MNT/Applications"
          "$MNT/Warden.app/Contents/MacOS/Warden" --selftest
          hdiutil detach "$MNT"

      - uses: actions/upload-artifact@v4
        with:
          name: Warden-mac-${{ matrix.arch }}
          path: |
            dist/Warden-mac-${{ matrix.arch }}.dmg
            dist/Warden-mac-${{ matrix.arch }}.dmg.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.arch }}
          path: pytest-full-${{ matrix.arch }}.xml
          if-no-files-found: ignore

  release:
    name: Attach to GitHub Release
    needs: build
    # Runs even if the best-effort Intel leg failed, as long as nothing was cancelled.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Warden-mac-*
          merge-multiple: true
          path: out

      - name: Require the Apple Silicon DMG
        run: |
          ls -la out
          test -f out/Warden-mac-arm64.dmg

      - name: Create the release if needed, then upload
        run: |
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease" ;; esac
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" $PRE --title "Warden $TAG" \
              --notes "Mac downloads: Warden-mac-arm64.dmg for Apple Silicon (M1 or newer), Warden-mac-x86_64.dmg for Intel Macs if attached. See the README's Mac section for first-launch steps."
          fi
          gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
