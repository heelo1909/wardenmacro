# Warden app settings. Copied to %LOCALAPPDATA%\Warden\config.yaml on first run;
# edit that copy (or use the GUI), not this file.
#
# Positions/ROIs are fractions of the Roblox client area: [x1, y1, x2, y2].
# HSV uses OpenCV ranges: H 0-179, S 0-255, V 0-255.
# Detector values below are UNCALIBRATED starting points - run the Calibration page.

active_preset: glass_wrap
contract_queue: []
observe_only: false

timings:
  tick_ms: 250
  jitter_pct: 15
  click_verify_ms: 400
  respawn_repress_s: 1.5
  switch_window_watch_s: 6
  state_save_s: 30
  timeouts:
    launching: 90
    loading: 120
    lobby: 30
    mode_select: 60
    midgame_join: 15
    loadout: 45
    dead: 20
    match_end: 60
    unknown_after: 45

input:
  methods: [sendinput, pydirectinput, pynput]
  jiggle_px: 3
  key_hold_ms: [40, 110]
  emergency_corner_px: 5
  emergency_hold_s: 0.3
  mode_list_scroll_steps: 12

recovery:
  prefer_button: leave          # leave | reconnect
  confirm_captures: 3
  confirm_seconds: 1.5
  leave_wait_s: 10
  close_grace_s: 10
  max_attempts: 3
  in_match_confirmations: 2
  confirmation_gap_s: 5
  browser_fallback: true
  backoff_initial_s: 30
  backoff_cap_s: 600
  alert_after_cycles: 3
  frozen_seconds: 30
  error_codes: [277, 279, 267, 268, 529]

hotkeys:
  start: F6
  pause: F7
  stop: F8
  screenshot: F9

automation:
  auto_reconnect: true
  respawn_recovery: true
  auto_requeue: true
  abilities: true
  anti_idle: true

integrations:
  discord_webhook:
    enabled: false
    url: ""
    interval_min: 15
    milestone_hours: 4
    include_screenshot: true
  discord_bot:
    enabled: false
    token: ""
    allowed_user_id: ""
  lan_dashboard:
    enabled: false
    host: 0.0.0.0
    port: 8765
    pin: ""
  toasts: true

scheduler:
  stop_at_time: null            # "HH:MM"
  windows: []                   # [{start: "22:00", end: "08:00"}]
  after_stop: nothing           # nothing | sleep | shutdown
  countdown_s: 60

gui:
  always_on_top: false
  mini_overlay: false
  log_verbosity: info
  minimize_on_start: true

estimate:
  count_lobby_time: false       # unconfirmed whether lobby time credits the contract
  ocr_verify: true

owned_weapons:                  # pool for the Random preset
  primary: [Assault Rifle, Grenade Launcher]
  secondary: [Handgun]
  melee: [Fists]
  utility: [Grenade]

weapon_templates_dir: templates/weapons

# Weapon picker layout (uncalibrated placeholders - run the Calibration page).
# grid_roi is where weapon tiles can be found after clicking a slot's tab;
# verify_roi is the HUD readout that shows what's currently equipped in that slot.
loadout_ui:
  # RIVALS: one weapon list per slot, primary -> secondary -> melee -> utility;
  # clicking a weapon moves on to the next slot. list_roi = where the list is.
  # Measured from a real 2560x1440 picker frame (2026-10-02).
  mode: sequential
  list_roi: [0.37, 0.22, 0.63, 1.0]
  max_search_scrolls: 6
  verify_threshold: 0.75
  scroll_notches: 2
  slots:
    primary:
      tab: [0.15, 0.15]
      grid_roi: [0.10, 0.25, 0.90, 0.85]
      verify_roi: [0.02, 0.90, 0.12, 0.98]
    secondary:
      tab: [0.35, 0.15]
      grid_roi: [0.10, 0.25, 0.90, 0.85]
      verify_roi: [0.14, 0.90, 0.24, 0.98]
    melee:
      tab: [0.55, 0.15]
      grid_roi: [0.10, 0.25, 0.90, 0.85]
      verify_roi: [0.26, 0.90, 0.36, 0.98]
    utility:
      tab: [0.75, 0.15]
      grid_roi: [0.10, 0.25, 0.90, 0.85]
      verify_roi: [0.38, 0.90, 0.48, 0.98]

detectors:
  # lobby_play / mode_list / ffa_tile ship with templates cut from a real RIVALS
  # session (2026-10-02, 2560x1440): the green Play button, the red close (X)
  # button that's always on the game-mode menu, and the "Free For All" title.
  lobby_play:
    method: template
    roi: [0.30, 0.65, 0.70, 1.0]
    template: { path: templates/lobby_play.png, threshold: 0.9, ref_height: 1440 }
    confirm_frames: 2
    params: { calibrated: 1 }
  mode_list:
    method: template
    roi: [0.75, 0.0, 1.0, 0.5]
    template: { path: templates/mode_list.png, threshold: 0.9, scale_min: 0.85, scale_max: 1.15, scale_steps: 7, ref_height: 1440 }
    confirm_frames: 2
    params: { calibrated: 1 }
  ffa_tile:
    method: template
    roi: [0.0, 0.10, 1.0, 1.0]
    template: { path: templates/ffa_tile.png, threshold: 0.85, scale_min: 0.85, scale_max: 1.15, scale_steps: 7, ref_height: 1440 }
    confirm_frames: 1
    params: { calibrated: 1 }
  map_vote:
    # After picking a mode, RIVALS shows a map-vote screen (countdown timer +
    # a grid of map tiles, "Random" always one of them) with no detector of
    # its own until now - Warden just sat there doing nothing until the
    # mode_select timeout gave up and soft-reset, which looked like it had
    # quit/needed help. Clicking "Random" resolves it regardless of which
    # other maps are offered that round, since it doesn't require knowing
    # the other (rotating) map names. Seeded from one real captured frame
    # (2026-10-03) - recalibrate via the Calibration page if it ever stops
    # matching (different map-vote layout, different resolution, etc).
    method: template
    roi: [0.20, 0.20, 0.75, 0.80]
    template: { path: templates/map_vote_random.png, threshold: 0.80, scale_min: 0.85, scale_max: 1.15, scale_steps: 7, ref_height: 1440 }
    confirm_frames: 1
    params: { calibrated: 1 }
  health_bar:
    # Calibrated 2026-10-02 from a real RIVALS frame (2560x1440): the lime-green
    # bar bottom-left. Fractions, so it carries over to other resolutions.
    method: color
    roi: [0.0, 0.84, 0.31, 1.0]
    hsv:
      - { lower: [40, 150, 170], upper: [66, 255, 255] }
    min_area: 0.0006
    max_area: 0.013
    aspect_min: 3.0
    aspect_max: 60.0
    confirm_frames: 2
    params: { calibrated: 1 }
  respawn_prompt:
    # Shipped: the "Respawn" text on RIVALS' green respawn button.
    method: template
    roi: [0.30, 0.55, 0.70, 0.90]
    template: { path: templates/respawn_prompt.png, threshold: 0.85, scale_min: 0.85, scale_max: 1.15, scale_steps: 7, ref_height: 1440 }
    confirm_frames: 2
    params: { calibrated: 1 }
  weapon_picker:
    # Shipped: the white-outlined "current slot" square at the top of RIVALS'
    # weapon picker (always centred, visible even when the list is scrolled).
    method: template
    roi: [0.40, 0.03, 0.60, 0.30]
    template: { path: templates/weapon_picker.png, threshold: 0.85, scale_min: 0.85, scale_max: 1.15, scale_steps: 7, ref_height: 1440 }
    confirm_frames: 1
    params: { calibrated: 1 }
  switch_weapons:
    method: template
    roi: [0.0, 0.0, 1.0, 1.0]
    template: { path: templates/switch_weapons.png, threshold: 0.78 }
    confirm_frames: 1
  midgame_join:
    # Off: uncalibrated, its "green button" guess fired on RIVALS' Play button.
    enabled: false
    method: color
    roi: [0.30, 0.40, 0.70, 0.90]
    hsv:
      - { lower: [45, 140, 140], upper: [80, 255, 255] }
    min_area: 0.004
    max_area: 0.08
    aspect_min: 1.5
    aspect_max: 8.0
    ocr: { contains: [JOIN] }
    confirm_frames: 2
  match_end:
    method: template
    roi: [0.0, 0.0, 1.0, 1.0]
    template: { path: templates/match_end.png, threshold: 0.78 }
    ocr: { contains: [RESULTS, VOTE, VICTORY, DEFEAT] }
    confirm_frames: 2
  disconnect_modal:
    method: composite
    roi: [0.25, 0.25, 0.75, 0.75]
    ocr: { contains: [DISCONNECTED, "ERROR CODE", LOST CONNECTION, SHUT DOWN] }
    confirm_frames: 3
  roblox_updating:
    method: window
    confirm_frames: 1
  frozen:
    method: frozen
    confirm_frames: 1
  idle_warning:
    method: ocr
    roi: [0.25, 0.25, 0.75, 0.75]
    ocr: { contains: [IDLE, "20 MINUTES"] }
    confirm_frames: 1
  contract_progress:
    # Reads the game's own playtime/progress readout (opportunistically, while
    # safely in the lobby) to correct the estimate - section 8.1. Uncalibrated
    # placeholder ROI; run Calibration to match your own screen.
    method: ocr
    roi: [0.0, 0.55, 0.15, 0.65]
    ocr: { contains: [] }
    confirm_frames: 1
